<html lang="ru">

    <title>Рублино — деревянные дома</title>
    <!-- Fonts are served from this origin; warm the two the first screen paints with. -->

    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin.woff2" crossorigin />
    <!-- First construction frame: start it before the bundle runs, matching the set the device will use. -->
    <link rel="preload" as="image" href="/frames/mobile/frame_0001.webp" media="(max-width: 767px) and (orientation: landscape)" />
    <link rel="preload" as="image" href="/frames/desktop/frame_0001.webp" media="(min-width: 768px)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
